[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mai_rag"
version = "0.1.9"
description = "Modern AI Pro — AI Architect course lab kit. A glass-box facade over the RAG ecosystem with a ready-to-go SQL + vector data layer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Modern AI Pro" }]
dependencies = [
    "numpy>=1.24",
    "sqlite-vec>=0.1.6",
    "sentence-transformers>=2.6",   # local, keyless embeddings (MiniLM)
    "matplotlib>=3.7",
    "pandas>=2.0",                  # labs render scorecards/tables as DataFrames
    "pyyaml>=6.0",                  # lab 4b memory stack (working.yaml / profile.yaml)
    "networkx>=3.0",                # graph layer local backend (mai_rag.graph)
    "openai>=1.30",                 # OpenAI-compatible: OpenAI, Azure, Groq (base_url)
    "langchain-groq>=0.2",          # labs 1-4 generation (imported at cell top → must be core)
    "rank-bm25>=0.2",               # lab 2 hybrid retrieval
    "tavily-python>=0.5",           # lab 3 web-search (CRAG) fallback
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Each module's notebook installs only what it needs — keeps Colab installs fast.
evals  = ["ragas>=0.2", "datasets>=2.19"]
deepeval = ["deepeval>=1.0"]      # lab 5's third metric backend (routed through mai_rag.llm)
gemini = ["google-generativeai>=0.7"]
rerank = ["cohere>=5.5", "voyageai>=0.2"]
graph  = ["neo4j>=5.20"]
agents = ["langgraph>=0.2"]     # lab 3c — agent architectures as glass-box graphs
adk    = ["google-adk[extensions]>=2.0"]   # lab 3d — the enterprise stack (LiteLLM adapter included)
memory = ["mem0ai>=0.1"]
viz    = ["umap-learn>=0.5", "scikit-learn>=1.4"]

[tool.setuptools.packages.find]
include = ["mai_rag*"]

[tool.setuptools.package-data]
mai_rag = [
    "data/policy/*.md", "data/policy/*.json", "data/policy.db",
    "data/hard/*.md", "data/golden_seed_hard.json",
    "data/catalog/*.md", "data/golden_seed_catalog.json",
    # Lab 6 (guardrails / RLS / EU AI Act) + Lab 7 (HITL action set) fixtures
    "data/golden_attacks.json", "data/golden_seed_action.json",
    "data/eu_ai_act_map.json", "data/governance_canvas.json",
    # Lab 2c reads this directly off mai_rag/data — without it, a non-editable
    # (pip install from git) student gets FileNotFoundError at stage 1.
    "data/hard_triples.json",
    "data/COMPANY_BIBLE.md",
]
